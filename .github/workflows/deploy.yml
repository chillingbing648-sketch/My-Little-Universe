name: Deploy My Little Universe

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build My Little Universe
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          BASE_PATH="$PAGES_BASE_PATH"
          if [ -z "$BASE_PATH" ]; then
            BASE_PATH="/"
          else
            BASE_PATH="${BASE_PATH%/}/"
          fi

          echo "Building My Little Universe with base path: $BASE_PATH"
          npm run build -- --base="$BASE_PATH"

      - name: Verify Pages artifact
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          test -f dist/index.html
          test -d dist/assets
          grep -q 'My-Little-Universe' dist/index.html
          echo "Verified: Vite output exists and is configured for the GitHub Pages repository path."

      - name: Prepare Pages artifact
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: ./dist

  deploy:
    name: Deploy My Little Universe to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
